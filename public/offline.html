<!doctype html>
<!--
  Shown by the service worker (public/sw.js) when you open Snug without internet.
  It must work completely on its own, so styles are inline (no Tailwind here).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Snug · offline</title>
  <style>
    :root { --bg: #fdf8f6; --fg: #2b2024; --muted: #8a7a80; --accent: #e0607e; --surface: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171214; --fg: #f3eaec; --muted: #a8979d; --accent: #ec7d97; --surface: #221b1e; }
    }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--fg); text-align: center; padding: 24px; box-sizing: border-box;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card { background: var(--surface); border-radius: 28px; padding: 32px 24px; max-width: 340px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
    .heart { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 22px; background: var(--accent);
      color: #fff; font-size: 32px; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
    button { height: 48px; width: 100%; border: 0; border-radius: 999px; background: var(--accent);
      color: #fff; font-size: 16px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">♥</div>
    <h1>You're offline</h1>
    <p>Snug needs a little bit of internet to stay in sync with your partner. It'll be right here when you're back.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
